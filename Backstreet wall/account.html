<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prijava i registracija — Backstreet Wall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <header class="site-header">
      <a class="logo" href="index.html">Backstreet Wall</a>
      <a class="button button-outline" href="index.html">Natrag na početnu</a>
    </header>

    <main class="account-layout">
      <section class="form-card">
        <h1>Log in</h1>
        <p>Prijavi se na svoj račun.</p>

        <form action="#" method="post">
          <label for="login-name">Korisničko ime ili e-mail</label>
          <input
            id="login-name"
            name="login-name"
            type="text"
            autocomplete="username"
            placeholder="Korisničko ime ili e-mail"
          >

          <label for="login-password">Lozinka</label>
          <input
            id="login-password"
            name="login-password"
            type="password"
            autocomplete="current-password"
            placeholder="Lozinka"
          >

          <button class="button" type="button">Prijavi se</button>
        </form>
      </section>

      <section class="form-card">
        <h2>Registracija</h2>
        <p>Napravi novi račun.</p>

        <form action="#" method="post">
          <label for="register-name">Korisničko ime</label>
          <input
            id="register-name"
            name="register-name"
            type="text"
            autocomplete="username"
            placeholder="Odaberi korisničko ime"
          >

          <label for="register-email">E-mail</label>
          <input
            id="register-email"
            name="register-email"
            type="email"
            autocomplete="email"
            placeholder="ime@primjer.com"
          >

          <label for="register-password">Lozinka</label>
          <input
            id="register-password"
            name="register-password"
            type="password"
            autocomplete="new-password"
            placeholder="Odaberi lozinku"
          >

          <label for="register-password-confirm">Ponovi lozinku</label>
          <input
            id="register-password-confirm"
            name="register-password-confirm"
            type="password"
            autocomplete="new-password"
            placeholder="Ponovi lozinku"
          >

          <button class="button" type="button">Registriraj se</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        Kontakt:
        <a href="mailto:jetamsrnka@gmail.com">jetamsrnka@gmail.com</a>
      </p>
      <p>
        <a
          href="https://www.youtube.com/@taktexp/featured"
          target="_blank"
          rel="noopener noreferrer"
        >
          YouTube kanal
        </a>
      </p>
    </footer>

  </div>

</body>
</html>
